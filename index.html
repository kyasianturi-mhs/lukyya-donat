<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donat Lukkya | Home</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">Donat<span>Lukkya</span></div>
            <div class="nav-right">
                <a href="cekout.html" class="cart-icon">
                    <i class="fas fa-shopping-cart"></i>
                    <span id="cart-count">0</span>
                </a>
            </div>
        </nav>
    </header>

    <section class="hero">
        <h1>Donat Lukkya</h1>
        <p>Manisnya pas, lembutnya juara!</p>
    </section>

    <section id="produk" class="products">
        <h2 class="title">Varian Rasa Best Seller</h2>
        <div class="product-grid">
            <div class="card">
                <img src="C:/xampp/htdocs/penjualan/coklat.jpeg" alt="Coklat">
                <h3>Chocolate Melt</h3>
                <p>Rp 12.000</p>
                <button class="btn-add" onclick="addToCart('Chocolate Melt', 12000)">+ Keranjang</button>
            </div>

            <div class="card">
                <img src="C:/xampp/htdocs/penjualan/strowbery.jpeg" alt="Strawberry">
                <h3>Strawberry Pink</h3>
                <p>Rp 10.000</p>
                <button class="btn-add" onclick="addToCart('Strawberry Pink', 10000)">+ Keranjang</button>
            </div>

            <div class="card">
                <img src="C:/xampp/htdocs/penjualan/vanila.jpeg" alt="Vanila">
                <h3>Vanilla Snow</h3>
                <p>Rp 10.000</p>
                <button class="btn-add" onclick="addToCart('Vanilla Snow', 10000)">+ Keranjang</button>
            </div>

            <div class="card">
                <img src="C:/xampp/htdocs/penjualan/macha.jpeg" alt="Matcha">
                <h3>Green Tea Matcha</h3>
                <p>Rp 15.000</p>
                <button class="btn-add" onclick="addToCart('Green Tea Matcha', 15000)">+ Keranjang</button>
            </div>
        </div>
    </section>

    <script>
        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        function addToCart(name, price) {
            cart.push({ name, price });
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
            alert(name + " berhasil ditambah ke keranjang!");
        }

        function updateCartCount() {
            document.getElementById('cart-count').innerText = cart.length;
        }
        updateCartCount();
    </script>
</body>
</html>
